name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test (DaylitCore)
        run: swift test
        working-directory: mac
      - name: Build Daylit.app
        run: DAYLIT_UNIVERSAL=1 mac/build.sh "$RUNNER_TEMP"
      - name: Zip (ditto keeps the signature)
        run: ditto -c -k --keepParent "$RUNNER_TEMP/Daylit.app" "$RUNNER_TEMP/Daylit-mac.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Daylit-mac
          path: ${{ runner.temp }}/Daylit-mac.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Test (Rules, Config)
        run: dotnet test windows/tests/Daylit.Tests.csproj --nologo
      - name: Build Daylit.exe
        run: dotnet publish windows/Daylit.csproj -c Release -o out --nologo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Daylit-windows
          path: out/
