name: release
# Push a tag like v2.0.0 to build both apps and publish them as a GitHub Release.
on:
  push:
    tags: ['v*']
permissions:
  contents: read   # build jobs run repository code: read-only token
jobs:
  version:
    # Only vMAJOR.MINOR.PATCH tags build: the version goes into Info.plist, the .exe and file names.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: swift test
        working-directory: mac
      - name: Build (Apple silicon + Intel)
        # With the secrets MAC_CERT_P12 (base64 .p12) and MAC_CERT_PASSWORD the app is signed with that
        # certificate (a stable identity, so macOS keeps its permissions across updates); without them
        # build.sh signs ad-hoc, as before. See docs/release-signing.md.
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -n "$MAC_CERT_P12" ] && [ -n "$MAC_CERT_PASSWORD" ]; then
            KEYCHAIN="$RUNNER_TEMP/daylit-signing.keychain-db"
            P12="$RUNNER_TEMP/daylit-cert.p12"
            trap 'rm -f "$P12"' EXIT   # the decoded certificate never outlives this step
            KEYCHAIN_PASSWORD=$(uuidgen)
            printf '%s' "$MAC_CERT_P12" | base64 --decode > "$P12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 3600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$P12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
            rm -f "$P12"
            unset MAC_CERT_P12 MAC_CERT_PASSWORD   # not needed any more: keep them out of the build's environment
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            # No -v: a self-signed certificate is not "trusted", but codesign can still use it.
            DAYLIT_SIGN_IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | awk '/^ *[0-9]+\)/ {print $2; exit}')
            if [ -z "$DAYLIT_SIGN_IDENTITY" ]; then
              echo "::error::MAC_CERT_P12 holds no code-signing identity"
              exit 1
            fi
            export DAYLIT_SIGN_IDENTITY
          fi
          DAYLIT_UNIVERSAL=1 DAYLIT_VERSION="$VERSION" mac/build.sh "$RUNNER_TEMP"
          if [ -n "${KEYCHAIN:-}" ]; then
            codesign -dv "$RUNNER_TEMP/Daylit.app" 2>&1 | grep -E 'Authority|Signature|Identifier' | sed -n 1,3p || true
          fi
          ditto -c -k --keepParent "$RUNNER_TEMP/Daylit.app" "Daylit-mac-$VERSION.zip"
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/daylit-signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: Daylit-mac-*.zip
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test windows/tests/Daylit.Tests.csproj --nologo
      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet publish windows/Daylit.csproj -c Release -o out --nologo "-p:Version=$env:VERSION" -p:DebugType=none
          Remove-Item out/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath "Daylit-windows-$env:VERSION.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: Daylit-windows-*.zip
  release:
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job publishes the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          **macOS 14+** (Apple silicon and Intel): unzip `Daylit-mac-*.zip` and move `Daylit.app` to
          Applications. The app is not notarized by Apple, so the first open is blocked: open System
          Settings → Privacy & Security and click **Open Anyway** next to the message about Daylit.
          For DDC monitors on Apple silicon also run `brew install m1ddc` (m1ddc does not support Intel Macs).

          **Windows 10/11:** unzip `Daylit-windows-*.zip` (for example to `%LOCALAPPDATA%\Programs\Daylit`)
          and run `Daylit.exe`. If SmartScreen warns about an unknown publisher: **More info → Run anyway**.
          Needs the .NET 10 Desktop Runtime: `winget install Microsoft.DotNet.DesktopRuntime.10`.

          Setup (location, Home Assistant, keys): see docs/setup.md in the repository.
          NOTES
          gh release create "$TAG" Daylit-mac-*.zip Daylit-windows-*.zip \
            --repo "$GITHUB_REPOSITORY" --title "Daylit $TAG" --notes-file notes.md
  packages:
    # Homebrew tap, winget and packaging/ here, through packaging/publish.sh. Needs the secret
    # PACKAGES_TOKEN (a classic token with the public_repo scope); without it the job only warns.
    # winget runs only when the repository variable WINGET_AUTO is "true".
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}   # the tag that triggered the run, never a moving branch
          persist-credentials: false
      - name: Publish to the package managers
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          WINGET: ${{ vars.WINGET_AUTO == 'true' && '1' || '0' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PACKAGES_TOKEN is not set: update Homebrew and winget by hand (packaging/README.md)"
            exit 0
          fi
          packaging/publish.sh "$VERSION"
