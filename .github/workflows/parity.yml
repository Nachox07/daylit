name: parity
# A change to one app's file needs its twin in the other app changed too, or a waiver naming the file:
# "Parity: <files> — <why>" in a commit message or the pull request description (scripts/twins.json,
# CONTRIBUTING.md → Parity). Its own workflow so that editing the description re-runs only this check.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No generated files committed
        # A committed file that .gitignore matches is build output or bytecode added by mistake.
        run: |
          tracked=$(git ls-files -ci --exclude-standard)
          if [ -n "$tracked" ]; then echo "::error::committed files that .gitignore matches (git rm --cached them):"; echo "$tracked"; exit 1; fi
      - name: Guard tests
        run: python3 -I scripts/test_parity_guard.py
      - name: Parity guard
        env:
          # Through the environment, never pasted into the script: the body is text anyone can write.
          PARITY_PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I scripts/parity-guard.py --base "$BASE_SHA" --head "$HEAD_SHA"
