# Home Assistant helpers Daylit reads. Add this file as a package
# (configuration.yaml: homeassistant: packages: daylit: !include daylit_helpers.yaml)
# or create the same helpers from Settings → Devices & services → Helpers.
# One set of three levels per monitor; the names must match config.json. Without `initial`,
# Home Assistant keeps the values you set across restarts (set them once from the dashboard).

input_boolean:
  daylit_auto:
    name: Daylit automatic mode
    icon: mdi:brightness-auto

input_number:
  daylit_left_day:
    name: Left monitor, daytime (blind open)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  daylit_left_blind_down:
    name: Left monitor, daytime (blind closed)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  daylit_left_night:
    name: Left monitor, night
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  # Optional: change it to set the monitor right away, even when the computer is idle
  # (e.g. dim it from your phone while away). Name it in the monitor's "set" key.
  daylit_left_set:
    name: Left monitor, set now
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
  daylit_right_day:
    name: Right monitor, daytime (blind open)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  daylit_right_blind_down:
    name: Right monitor, daytime (blind closed)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  daylit_right_night:
    name: Right monitor, night
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"

# Daylit publishes sensor.daylit_left_monitor / sensor.daylit_right_monitor itself
# (state = applied level, attributes: target, manual, daylight, sun_elevation, blind, lights, source).
